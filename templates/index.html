<!DOCTYPE html>
<html>
<head>
    <title>Pocket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Pocket 💰</h1>
    <p>Track where your money goes.</p>

    <h2>Add an expense</h2>
    <form method="post" action="/add">
        <label>Amount</label>
        <input type="number" name="amount" step="0.01" placeholder="e.g. 5.50" required>

        <label>Category</label>
        <select name="category">
            <option>Food</option>
            <option>Transport</option>
            <option>Airtime</option>
            <option>Other</option>
        </select>

        <label>Note</label>
        <input type="text" name="note" placeholder="e.g. lunch">

        <button>Add</button>
    </form>

    <h2>My expenses</h2>
    <ul>
        {% for e in expenses %}
            <li>{{ "%.2f"|format(e["amount"]) }} - {{ e["category"] }} - {{ e["note"] }}</li>
        {% endfor %}
    </ul>

    <p><strong>Total: {{ "%.2f"|format(total) }}</strong></p>
</body>
</html>
