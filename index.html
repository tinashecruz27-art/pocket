<!DOCTYPE html>
<html>
<head>
    <title>Pocket</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pocket 💰</h1>
    <p>Track where your money goes.</p>

    <h2>Add an expense</h2>
    <form>
        <label>Amount</label>
        <input type="number" placeholder="e.g. 5.50">

        <label>Category</label>
        <select>
            <option>Food</option>
            <option>Transport</option>
            <option>Airtime</option>
            <option>Other</option>
        </select>

        <label>Note</label>
        <input type="text" placeholder="e.g. lunch">

        <button>Add</button>
    </form>

    <h2>My expenses</h2>
    <ul>
        <li>5.00 - Food - lunch</li>
        <li>3.00 - Transport - bus</li>
    </ul>

    <p><strong>Total: 8.00</strong></p>
</body>
</html>
